name: Build Kingdee-compatible guacd image

on:
  push:
    branches:
      - kingdee-compat
    paths:
      - .guacamole-version
      - Dockerfile
      - configure.ac
      - Makefile.am
      - bin/**
      - m4/**
      - src/**
      - util/**
      - .github/workflows/build-guacd.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-guacd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the compatibility branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine matching Guacamole version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < .guacamole-version)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Guacamole version: ${version}" >&2
            exit 1
          fi

          git rev-parse "refs/tags/${version}^{commit}" >/dev/null
          git merge-base --is-ancestor "${version}" HEAD
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Select release-specific build arguments
        id: build_args
        shell: bash
        env:
          GUACAMOLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "args<<EOF"
            echo "BUILD_ARCHITECTURE=X86"

            # Guacamole 1.6.0's Dockerfile selects the newest dependency tags
            # dynamically. Pin the versions that remain compatible with that
            # release. Newer Guacamole releases use their merged Dockerfile
            # defaults unless an explicit compatibility pin is later needed.
            if [ "${GUACAMOLE_VERSION}" = "1.6.0" ]; then
              echo "FREERDP_VERSION=2"
              echo "WITH_FREERDP=2.11.7"
              echo "WITH_LIBSSH2=libssh2-1.11.1"
              echo "WITH_LIBTELNET=0.23"
              echo "WITH_LIBVNCCLIENT=LibVNCServer-0.9.15"
              echo "WITH_LIBWEBSOCKETS=v4.3.3"
            fi

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/guacd-custom-patch
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Custom patched guacd
            org.opencontainers.image.description=Apache Guacamole guacd with Unicode-only RDP clipboard advertisement for legacy Kingdee clients
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build_args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
